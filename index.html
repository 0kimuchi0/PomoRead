<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-visual" />
    <meta name="theme-color" content="#534AB7" />
    <title>PomoRead</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      if (typeof structuredClone === 'undefined') {
        self.structuredClone = function(obj) {
          try { return JSON.parse(JSON.stringify(obj)); } catch { return obj; }
        };
      }
      // アプリが表示できなかったときだけ、案内画面を出す（動作中のアプリを置き換えない）
      var _jsErrors = [];
      var _fallbackShown = false;
      function _appRendered() {
        return !!document.querySelector('#root .app, #root .app-splash');
      }
      function _showFallback() {
        var r = document.getElementById('root');
        if (!r || _appRendered()) return;
        _fallbackShown = true;
        var dark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
        var c = dark
          ? { bg: '#13131F', card: '#1E1E2E', text: '#E8E8F0', muted: '#9090B0', border: '#2A2A3E', pre: '#13131F' }
          : { bg: '#F4F4F8', card: '#FFFFFF', text: '#1A1A2E', muted: '#6B6B8A', border: '#E0DFF0', pre: '#F4F4F8' };
        var wrap = document.createElement('div');
        wrap.style.cssText = 'min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;box-sizing:border-box;background:' + c.bg + ';font-family:-apple-system,BlinkMacSystemFont,sans-serif;';
        var card = document.createElement('div');
        card.style.cssText = 'max-width:420px;width:100%;background:' + c.card + ';border:1px solid ' + c.border + ';border-radius:16px;padding:28px 24px;text-align:center;color:' + c.text + ';';
        var title = document.createElement('p');
        title.textContent = 'アプリを表示できませんでした';
        title.style.cssText = 'font-size:17px;font-weight:700;margin:0 0 10px;';
        var body = document.createElement('p');
        body.textContent = 'ページを再読み込みしてください。直らない場合は、お手数ですが support@pomoread.com までお知らせください。';
        body.style.cssText = 'font-size:14px;line-height:1.7;color:' + c.muted + ';margin:0 0 18px;';
        var btn = document.createElement('button');
        btn.textContent = '再読み込み';
        btn.style.cssText = 'padding:10px 28px;font-size:15px;font-weight:600;background:#534AB7;color:#fff;border:none;border-radius:10px;cursor:pointer;';
        btn.onclick = function() { location.reload(); };
        card.appendChild(title);
        card.appendChild(body);
        card.appendChild(btn);
        if (_jsErrors.length) {
          var det = document.createElement('details');
          det.style.cssText = 'margin-top:20px;text-align:left;';
          var sum = document.createElement('summary');
          sum.textContent = 'エラーの詳細（お問い合わせの際に添えてください）';
          sum.style.cssText = 'font-size:12px;color:' + c.muted + ';cursor:pointer;';
          var pre = document.createElement('pre');
          pre.textContent = _jsErrors.join('\n\n');
          pre.style.cssText = 'white-space:pre-wrap;word-break:break-all;font-size:11px;background:' + c.pre + ';border-radius:8px;padding:10px;margin:8px 0 0;max-height:240px;overflow:auto;';
          det.appendChild(sum);
          det.appendChild(pre);
          card.appendChild(det);
        }
        wrap.appendChild(card);
        r.replaceChildren(wrap);
      }
      function _recordError(text) {
        _jsErrors.push(text);
        if (_fallbackShown) { _fallbackShown = false; _showFallback(); return; }
        // React がエラーでツリーを外すのはこの後なので、少し待ってから判定する
        setTimeout(_showFallback, 1000);
      }
      window.onerror = function(msg, src, line, col, err) {
        _recordError(String(msg) + '\n' + (err && err.stack ? err.stack : (src + ':' + line)));
      };
      window.addEventListener('unhandledrejection', function(e) {
        _recordError(e.reason ? (e.reason.stack || String(e.reason)) : 'Unhandled rejection');
      });
      setTimeout(_showFallback, 10000);
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
