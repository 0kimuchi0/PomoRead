name: Deploy to Vercel

on:
  push:
    branches:
      - master
      - main

# 本番に反映する前に、利用者の承認を待つ。
#   1. notify: マージした PR に、すぐ承認・却下の画面のリンクをコメントし、ラベル「承認待ち」を付ける（プレビューを待たずに知らせる）
#   2. preview: master の版をプレビューとして公開し、決まったアドレス staging.pomoread.com にも付け替える（本番には出ない）。
#      できたら、1 のコメントにプレビューのアドレスを書き足す
#   3. approve: GitHub の Environment「production」の承認を待つ（承認者を設定しておく）
#   4. migrate → deploy: 承認されたら、データベースと pomoread.com に反映する
#   5. ios: 承認したコミットにタグ release-<番号> を付け、そのタグで Codemagic の iOS ビルドを始める（TestFlight に配信される）
#   6. project: GitHub Projects「PomoRead」の「承認待ち」にある PR のうち、今回反映したものを「本番反映済み」に移す
#   7. labels: ラベル「承認待ち」の PR のうち、今回反映したものを、ラベル「本番反映済み」に付け替える
# master への Vercel の自動公開は vercel.json で止めてあり、本番に出るのはこの流れだけ
jobs:
  notify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: write
    outputs:
      pr: ${{ steps.comment.outputs.pr }}
      comment_id: ${{ steps.comment.outputs.comment_id }}
    steps:
      # マージした PR に確認用のリンクを書き込む（通知からそのまま開けるように）。
      # checkout などの準備がいらないので、マージして数秒で付く
      - name: Comment approval link on the merged PR
        id: comment
        run: |
          pr=$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/pulls" --jq '.[0].number // empty')
          if [ -z "$pr" ]; then
            echo "このコミットに対応する PR が見つからないので、コメントはしない"
            exit 0
          fi
          body=$(cat <<BODY
          master にマージされました。承認するまで本番（pomoread.com・データベース・TestFlight）には反映されません。

          - プレビュー: 作っています（30 秒ほどでできます。できたら、ここにアドレスが出ます）
          - 承認・却下: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID
            - プレビューができると「Review deployments」が出ます →「Production」→「Approve and deploy」または「Reject」

          プレビューも本番と同じデータベースを使います。データを書き換える操作は本番のデータに入ります。
          BODY
          )
          comment_id=$(gh api "repos/$GITHUB_REPOSITORY/issues/$pr/comments" -f body="$body" --jq '.id')
          # PR の一覧で、承認待ちのものを絞り込めるようにする（承認後に labels ジョブが「本番反映済み」に付け替える）
          gh api -X POST "repos/$GITHUB_REPOSITORY/issues/$pr/labels" -f "labels[]=承認待ち" >/dev/null
          echo "pr=$pr" >> "$GITHUB_OUTPUT"
          echo "comment_id=$comment_id" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ github.token }}

  preview:
    runs-on: ubuntu-latest
    needs: notify
    permissions:
      contents: read
      pull-requests: write
    steps:
      # ビルドは Vercel の側で行うので、ここでは npm ci やビルドをしない（二重になるため）
      - uses: actions/checkout@v4

      - name: Deploy preview to Vercel
        id: preview
        run: |
          url=$(npx --yes vercel deploy --token="$VERCEL_TOKEN" --yes)
          echo "url=$url" >> "$GITHUB_OUTPUT"
          {
            echo "## 本番に出す前のプレビュー"
            echo ""
            echo "https://$STAGING_HOST （この版のアドレス: $url）"
            echo ""
            echo "動きを確かめてから、この実行の画面で「Review deployments」→「production」を承認すると、データベースと pomoread.com に反映されます。"
            echo "プレビューも本番と同じデータベースを使うので、データを書き換える操作は本番のデータに入ります。"
          } >> "$GITHUB_STEP_SUMMARY"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: team_99DGzyn9jugmw331mbDew6U6
          VERCEL_PROJECT_ID: prj_y3mFSxJLjiNKJcxGSKt4k9i7NyFD
          STAGING_HOST: staging.pomoread.com

      # 承認待ちの最新の版を、いつも同じアドレスで確かめられるようにする
      - name: Point staging.pomoread.com to the preview
        run: npx --yes vercel alias set "$URL" "$STAGING_HOST" --token="$VERCEL_TOKEN" --scope=0daiki0-projects
        env:
          URL: ${{ steps.preview.outputs.url }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          STAGING_HOST: staging.pomoread.com

      # notify のコメントを、プレビューのアドレス入りに書き換える
      - name: Add the preview link to the comment
        if: needs.notify.outputs.comment_id != ''
        run: |
          body=$(cat <<BODY
          本番に出す前のプレビューができました。承認するまで本番（pomoread.com・データベース・TestFlight）には反映されません。

          - プレビュー: https://$STAGING_HOST （この版だけのアドレス: $URL）
          - 承認・却下: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID
            - 「Review deployments」→「Production」→「Approve and deploy」または「Reject」

          プレビューも本番と同じデータベースを使います。データを書き換える操作は本番のデータに入ります。
          BODY
          )
          gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$COMMENT_ID" -f body="$body" >/dev/null
        env:
          GH_TOKEN: ${{ github.token }}
          COMMENT_ID: ${{ needs.notify.outputs.comment_id }}
          URL: ${{ steps.preview.outputs.url }}
          STAGING_HOST: staging.pomoread.com

  approve:
    runs-on: ubuntu-latest
    needs: preview
    # Environment「production」に承認者を設定しておくと、ここで承認を待つ
    environment:
      name: production
      url: https://pomoread.com
    steps:
      - run: echo "本番への反映が承認されました"

  migrate:
    runs-on: ubuntu-latest
    needs: approve
    steps:
      - uses: actions/checkout@v4

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Verify Supabase token is set
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::SUPABASE_ACCESS_TOKEN secret is not set"
            exit 1
          fi
          echo "Token is set (length: ${#SUPABASE_ACCESS_TOKEN})"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Link Supabase project
        run: supabase link --project-ref ltsdsjrzfvbguissmxxw
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Push database migrations
        run: supabase db push --linked --yes
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      # supabase/functions 以下の Edge Function を本番に反映する（関数が1つもないときは飛ばす）
      - name: Deploy edge functions
        if: hashFiles('supabase/functions/**') != ''
        # notify-feedback は未ログインの人のフィードバックからも呼ぶため、ログインの確認（JWT）をしない。
        # 関数側は「まだ知らせていないもの」しか送らないので、誰が何度呼んでも同じメールは二度送られない
        run: supabase functions deploy --use-api --yes --no-verify-jwt
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

  deploy:
    runs-on: ubuntu-latest
    needs: migrate
    steps:
      # ビルドは Vercel の側で行うので、ここでは npm ci やビルドをしない（プレビューと同じ）
      - uses: actions/checkout@v4

      - name: Deploy to Vercel
        run: npx --yes vercel deploy --prod --token="$VERCEL_TOKEN" --yes
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: team_99DGzyn9jugmw331mbDew6U6
          VERCEL_PROJECT_ID: prj_y3mFSxJLjiNKJcxGSKt4k9i7NyFD

  ios:
    runs-on: ubuntu-latest
    needs: deploy
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      # 承認したコミットそのものをビルドするため、タグを付ける（ブランチ名で頼むと、その間にマージされた未承認の版がビルドされうる）。
      # タグは、本番に出した版の記録にもなる
      - name: Tag the approved commit
        id: tag
        run: |
          tag="release-${{ github.run_number }}"
          git tag "$tag" "$GITHUB_SHA"
          git push origin "$tag"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Start iOS build on Codemagic
        run: |
          if [ -z "$CODEMAGIC_API_TOKEN" ]; then
            echo "::error::CODEMAGIC_API_TOKEN secret is not set"
            exit 1
          fi
          body=$(printf '{"appId":"%s","workflowId":"ios-release","tag":"%s"}' "$CODEMAGIC_APP_ID" "$TAG")
          status=$(curl -sS -o response.json -w '%{http_code}' -X POST https://api.codemagic.io/builds \
            -H "Content-Type: application/json" -H "x-auth-token: $CODEMAGIC_API_TOKEN" -d "$body")
          if [ "$status" -ge 300 ]; then
            echo "::error::Codemagic API returned HTTP $status"
            cat response.json
            exit 1
          fi
          build_id=$(jq -r '.buildId' response.json)
          echo "## iOS ビルド" >> "$GITHUB_STEP_SUMMARY"
          echo "タグ $TAG で Codemagic のビルドを始めました: https://codemagic.io/app/$CODEMAGIC_APP_ID/build/$build_id" >> "$GITHUB_STEP_SUMMARY"
        env:
          CODEMAGIC_API_TOKEN: ${{ secrets.CODEMAGIC_API_TOKEN }}
          CODEMAGIC_APP_ID: 6a0da308c772daab0da9b121
          TAG: ${{ steps.tag.outputs.tag }}

  project:
    runs-on: ubuntu-latest
    needs: deploy
    steps:
      - uses: actions/checkout@v4
        with:
          # 「今回反映したコミットに含まれる PR か」を調べるため、履歴をすべて取る
          fetch-depth: 0

      - name: Move released PRs to 本番反映済み
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::warning::PROJECT_TOKEN secret is not set. プロジェクトの列は移さない"
            exit 0
          fi
          .github/scripts/move-released-to-done.sh
        env:
          GH_TOKEN: ${{ secrets.PROJECT_TOKEN }}
          RELEASED_SHA: ${{ github.sha }}
          PROJECT_OWNER: daiki0828
          PROJECT_TITLE: PomoRead
          REPOSITORY: ${{ github.repository }}

  labels:
    runs-on: ubuntu-latest
    needs: deploy
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          # 「今回反映したコミットに含まれる PR か」を調べるため、履歴をすべて取る
          fetch-depth: 0

      - name: Relabel released PRs to 本番反映済み
        run: .github/scripts/relabel-released.sh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASED_SHA: ${{ github.sha }}
          REPOSITORY: ${{ github.repository }}
