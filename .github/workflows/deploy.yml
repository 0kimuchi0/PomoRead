name: Deploy to Vercel

on:
  push:
    branches:
      - master
      - main

# 本番に反映する前に、利用者の承認を待つ。
#   1. preview: master の版をプレビューとして公開し、決まったアドレス staging.pomoread.com にも付け替える（本番には出ない）。
#      マージした PR に、プレビューと承認・却下の画面のリンクをコメントする
#   2. approve: GitHub の Environment「production」の承認を待つ（承認者を設定しておく）
#   3. migrate → deploy: 承認されたら、データベースと pomoread.com に反映する
#   4. ios: 承認したコミットにタグ release-<番号> を付け、そのタグで Codemagic の iOS ビルドを始める（TestFlight に配信される）
# master への Vercel の自動公開は vercel.json で止めてあり、本番に出るのはこの流れだけ
jobs:
  preview:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Deploy preview to Vercel
        id: preview
        run: |
          url=$(npx vercel deploy --token="$VERCEL_TOKEN" --yes)
          echo "url=$url" >> "$GITHUB_OUTPUT"
          {
            echo "## 本番に出す前のプレビュー"
            echo ""
            echo "https://$STAGING_HOST （この版のアドレス: $url）"
            echo ""
            echo "動きを確かめてから、この実行の画面で「Review deployments」→「production」を承認すると、データベースと pomoread.com に反映されます。"
            echo "プレビューも本番と同じデータベースを使うので、データを書き換える操作は本番のデータに入ります。"
          } >> "$GITHUB_STEP_SUMMARY"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: team_99DGzyn9jugmw331mbDew6U6
          VERCEL_PROJECT_ID: prj_y3mFSxJLjiNKJcxGSKt4k9i7NyFD
          STAGING_HOST: staging.pomoread.com

      # 承認待ちの最新の版を、いつも同じアドレスで確かめられるようにする
      - name: Point staging.pomoread.com to the preview
        run: npx vercel alias set "$URL" "$STAGING_HOST" --token="$VERCEL_TOKEN" --scope=0daiki0-projects
        env:
          URL: ${{ steps.preview.outputs.url }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          STAGING_HOST: staging.pomoread.com

      # マージした PR に確認用のリンクを書き込む（通知からそのまま開けるように）
      - name: Comment links on the merged PR
        run: |
          pr=$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/pulls" --jq '.[0].number // empty')
          if [ -z "$pr" ]; then
            echo "このコミットに対応する PR が見つからないので、コメントはしない"
            exit 0
          fi
          gh pr comment "$pr" --repo "$GITHUB_REPOSITORY" --body "$(cat <<BODY
          本番に出す前のプレビューができました。承認するまで本番（pomoread.com・データベース・TestFlight）には反映されません。

          - プレビュー: https://$STAGING_HOST （この版だけのアドレス: $URL）
          - 承認・却下: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID
            - 「Review deployments」→「Production」→「Approve and deploy」または「Reject」

          プレビューも本番と同じデータベースを使います。データを書き換える操作は本番のデータに入ります。
          BODY
          )"
        env:
          GH_TOKEN: ${{ github.token }}
          URL: ${{ steps.preview.outputs.url }}
          STAGING_HOST: staging.pomoread.com

  approve:
    runs-on: ubuntu-latest
    needs: preview
    # Environment「production」に承認者を設定しておくと、ここで承認を待つ
    environment:
      name: production
      url: https://pomoread.com
    steps:
      - run: echo "本番への反映が承認されました"

  migrate:
    runs-on: ubuntu-latest
    needs: approve
    steps:
      - uses: actions/checkout@v4

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Verify Supabase token is set
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::SUPABASE_ACCESS_TOKEN secret is not set"
            exit 1
          fi
          echo "Token is set (length: ${#SUPABASE_ACCESS_TOKEN})"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Link Supabase project
        run: supabase link --project-ref ltsdsjrzfvbguissmxxw
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Repair migration history
        run: |
          supabase migration repair --status reverted 20260518 2>/dev/null || true
          supabase migration repair --status reverted 20260520 2>/dev/null || true
          supabase migration repair --status applied 20260518000000 || true
          supabase migration repair --status applied 20260520000000 || true
          supabase migration repair --status applied 20260520120000 || true
          supabase migration repair --status applied 20260521000000 || true
          supabase migration repair --status applied 20260526000000 || true
          supabase migration repair --status applied 20260618000000 || true
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Push database migrations
        run: supabase db push --linked --yes
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      # supabase/functions 以下の Edge Function を本番に反映する（関数が1つもないときは飛ばす）
      - name: Deploy edge functions
        if: hashFiles('supabase/functions/**') != ''
        # notify-feedback は未ログインの人のフィードバックからも呼ぶため、ログインの確認（JWT）をしない。
        # 関数側は「まだ知らせていないもの」しか送らないので、誰が何度呼んでも同じメールは二度送られない
        run: supabase functions deploy --use-api --yes --no-verify-jwt
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

  deploy:
    runs-on: ubuntu-latest
    needs: migrate
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Deploy to Vercel
        run: npx vercel deploy --prod --token="$VERCEL_TOKEN" --yes
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: team_99DGzyn9jugmw331mbDew6U6
          VERCEL_PROJECT_ID: prj_y3mFSxJLjiNKJcxGSKt4k9i7NyFD

  ios:
    runs-on: ubuntu-latest
    needs: deploy
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      # 承認したコミットそのものをビルドするため、タグを付ける（ブランチ名で頼むと、その間にマージされた未承認の版がビルドされうる）。
      # タグは、本番に出した版の記録にもなる
      - name: Tag the approved commit
        id: tag
        run: |
          tag="release-${{ github.run_number }}"
          git tag "$tag" "$GITHUB_SHA"
          git push origin "$tag"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Start iOS build on Codemagic
        run: |
          if [ -z "$CODEMAGIC_API_TOKEN" ]; then
            echo "::error::CODEMAGIC_API_TOKEN secret is not set"
            exit 1
          fi
          body=$(printf '{"appId":"%s","workflowId":"ios-release","tag":"%s"}' "$CODEMAGIC_APP_ID" "$TAG")
          status=$(curl -sS -o response.json -w '%{http_code}' -X POST https://api.codemagic.io/builds \
            -H "Content-Type: application/json" -H "x-auth-token: $CODEMAGIC_API_TOKEN" -d "$body")
          if [ "$status" -ge 300 ]; then
            echo "::error::Codemagic API returned HTTP $status"
            cat response.json
            exit 1
          fi
          build_id=$(jq -r '.buildId' response.json)
          echo "## iOS ビルド" >> "$GITHUB_STEP_SUMMARY"
          echo "タグ $TAG で Codemagic のビルドを始めました: https://codemagic.io/app/$CODEMAGIC_APP_ID/build/$build_id" >> "$GITHUB_STEP_SUMMARY"
        env:
          CODEMAGIC_API_TOKEN: ${{ secrets.CODEMAGIC_API_TOKEN }}
          CODEMAGIC_APP_ID: 6a0da308c772daab0da9b121
          TAG: ${{ steps.tag.outputs.tag }}
