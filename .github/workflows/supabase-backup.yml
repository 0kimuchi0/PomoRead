name: Supabase Backup

# 無料プランには自分でダウンロードできるバックアップがないため、毎週データベースを書き出して保存する。
# リポジトリが公開なので、中身は必ず BACKUP_PASSPHRASE で暗号化してから Artifact に置く。
# 復元手順:
#   1. Actions の実行結果から supabase-backup-<日付> をダウンロードして展開
#   2. gpg --decrypt --output backup.tar.gz backup.tar.gz.gpg   （パスフレーズを入力）
#   3. tar -xzf backup.tar.gz  → schema.sql（構造）/ data.sql（データ）/ roles.sql（ロール）
#   4. 書き戻すときは verify ジョブと同じ順番（roles → schema → data）で psql に流す
# verify ジョブは毎回、作ったバックアップを使い捨てのデータベースに実際に復元して、取り出せることを確かめる。
on:
  schedule:
    - cron: '0 15 * * 0' # 毎週月曜 0:00（日本時間）。GitHub の混雑で数分〜数十分遅れることがある
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      artifact: supabase-backup-${{ steps.encrypt.outputs.date }}
    # シークレットはジョブ全体ではなく、必要なステップにだけ渡す（サードパーティの action から見えないように）
    env:
      PROJECT_REF: ltsdsjrzfvbguissmxxw
    steps:
      - name: Check secrets
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::SUPABASE_ACCESS_TOKEN secret is not set"
            exit 1
          fi
          if [ -z "$BACKUP_PASSPHRASE" ]; then
            echo "::error::BACKUP_PASSPHRASE secret is not set"
            exit 1
          fi

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 3.4.0

      - name: Dump database
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          mkdir -p backup
          supabase link --project-ref "$PROJECT_REF"
          # CLI が作る一時ログインロールは接続プールへの反映に少し時間がかかることがあるため、失敗したら待って再試行する
          dump() {
            for i in 1 2 3 4; do
              supabase db dump --linked "$@" && return 0
              echo "retrying in 20s..."; sleep 20
            done
            return 1
          }
          dump -f backup/schema.sql
          dump --data-only --use-copy -f backup/data.sql
          dump --role-only -f backup/roles.sql
          ls -l backup
          # 空のダンプを「成功」として保存しないようにする
          test -s backup/schema.sql
          test -s backup/data.sql

      - name: Encrypt
        id: encrypt
        env:
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          tar -czf backup.tar.gz -C backup .
          # パスフレーズはコマンドライン引数や echo を使わず、ファイル記述子 3 から渡す
          gpg --batch --yes --pinentry-mode loopback --passphrase-fd 3 \
            --symmetric --cipher-algo AES256 --output backup.tar.gz.gpg backup.tar.gz \
            3<<<"$BACKUP_PASSPHRASE"
          # 平文は Artifact に含めない
          rm -rf backup backup.tar.gz
          echo "DATE=$(date -u +%Y%m%d)" >> "$GITHUB_ENV"
          echo "date=$(date -u +%Y%m%d)" >> "$GITHUB_OUTPUT"

      - name: Upload encrypted backup
        uses: actions/upload-artifact@v4
        with:
          name: supabase-backup-${{ env.DATE }}
          path: backup.tar.gz.gpg
          retention-days: 90
          if-no-files-found: error

  # 作ったバックアップを、このジョブの中だけの使い捨てデータベースに復元して確かめる。
  # 復元したデータはログにも Artifact にも出さない（件数などの中身も表示しない）
  verify:
    needs: backup
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Download encrypted backup
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.backup.outputs.artifact }}

      - name: Decrypt
        env:
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          gpg --batch --yes --pinentry-mode loopback --passphrase-fd 3 \
            --decrypt --output backup.tar.gz backup.tar.gz.gpg \
            3<<<"$BACKUP_PASSPHRASE"
          mkdir -p restore
          tar -xzf backup.tar.gz -C restore
          rm backup.tar.gz
          ls -l restore

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 3.4.0

      - name: Start empty database
        run: |
          mkdir -p scratch && cd scratch
          supabase init --force
          supabase db start

      - name: Restore
        run: |
          DB=postgresql://postgres:postgres@127.0.0.1:54322/postgres
          psql "$DB" --quiet --single-transaction --variable ON_ERROR_STOP=1 \
            --file restore/roles.sql \
            --file restore/schema.sql \
            --command 'SET session_replication_role = replica' \
            --file restore/data.sql > /dev/null

      - name: Check restored data
        run: |
          DB=postgresql://postgres:postgres@127.0.0.1:54322/postgres
          q() { psql "$DB" --tuples-only --no-align --command "$1"; }
          tables=$(q "select count(*) from pg_tables where schemaname = 'public'")
          filled=0
          for t in $(q "select tablename from pg_tables where schemaname = 'public'"); do
            [ "$(q "select exists (select 1 from public.\"$t\")")" = "t" ] && filled=$((filled + 1))
          done
          users=$(q "select exists (select 1 from auth.users)")
          echo "public のテーブル: ${tables} 個（うちデータのあるもの: ${filled} 個）"
          test "$tables" -gt 0
          test "$filled" -gt 0
          test "$users" = "t"
          echo "バックアップから復元できることを確認しました"

      - name: Clean up
        if: always()
        run: rm -rf restore backup.tar.gz.gpg
